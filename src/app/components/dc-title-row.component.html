<div class="dc-title-row">
  <div class="dc-title-row-bar" aria-hidden="true"></div>
  <ng-template #title><ng-content></ng-content></ng-template>
  <h1 *ngIf="level === 1" class="dc-title-row-heading">
    <ng-container *ngTemplateOutlet="title"></ng-container>
  </h1>
  <h2 *ngIf="level !== 1" class="dc-title-row-heading">
    <ng-container *ngTemplateOutlet="title"></ng-container>
  </h2>
</div>
