<div class="row justify-content-center" *ngFor="let members of memberRows; trackBy: trackByIndex">
  <div class="col-md-12 col-lg-8">
    <div class="row">
      <div class="col" *ngFor="let member of members; trackBy: trackByIndex">
        <div class="image-wrap mb-3">
          <a *ngIf="member.person" href="{{member.person.url}}" target="_blank" class="image-lighten">
            <img src="{{member.imageUrl}}" alt="" width="300" height="300" class="img-fluid">
            <div class="member-text">{{member.person.names | localize}}</div>
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
